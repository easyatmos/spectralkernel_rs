name: Publish spectralkernel_rs to PyPI

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  BuildLinux:
    name: Build Linux wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build manylinux wheels with Maturin
        run: |
          bash ./scripts/build_manylinux_wheel.sh

      - name: Install Linux test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Test Linux wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall "$(find dist -name '*cp312*.whl' | head -n 1)"
          python -m pytest -q tests/test_sphere_ops.py

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  BuildMacOS:
    name: Build macOS wheels (arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build macOS wheels
        shell: bash
        run: |
          bash ./scripts/build_macos_wheel.sh

      - name: Verify built wheels
        shell: bash
        run: |
          ls -lh dist/*.whl

          python -m pip install --upgrade pip pytest
          python -m pip install --force-reinstall "$(find dist -name '*cp312*.whl' | head -n 1)"
          python -c "import spectralkernel_rs.spectralkernel_rs; print('spectralkernel_rs import ok')"
          python -m pytest -q tests/test_sphere_ops.py

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist/

  BuildWindows:
    name: Build Windows wheels
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows wheels
        shell: pwsh
        run: |
          ./scripts/build_manywindows_wheel.ps1

      - name: Test Windows wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pytest
          $wheel = Get-ChildItem dist -Filter '*cp312*.whl' | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          python -m pytest -q tests/test_sphere_ops.py

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

  Publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - BuildLinux
      - BuildMacOS
      - BuildWindows
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-macos-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.whl
            dist/**/*.tar.gz
