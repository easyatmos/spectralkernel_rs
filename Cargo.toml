[package]
name = "spectralkernel_rs"
version = "1.0.1"
edition = "2024"
description = "Rust atmosphere spectral transform kernels with Python bindings"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/easyatmos/spectralkernel_rs"
homepage = "https://github.com/easyatmos/spectralkernel_rs"
documentation = "https://github.com/easyatmos/spectralkernel_rs"
keywords = ["spectral", "spherical-harmonics", "climate", "python"]
categories = ["science"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**",
]

[lib]
name = "spectralkernel_rs"
# "cdylib" is used to create dynamic libraries that can be imported by Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.12"
numpy = "0.29"
ndarray = "0.17"
num-complex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = 3

[dev-dependencies]
criterion = "0.5"
